<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/>
<title>WealthLens</title>

<!-- ── Android / Chrome / Edge PWA install ────────────────────────────────── -->
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#7c3aed"/>

<!-- ── iOS Safari "Add to Home Screen" ─────────────────────────────────────
     iOS ignores manifest.json for install metadata — it needs these tags
     directly, plus an apple-touch-icon. Without apple-mobile-web-app-capable,
     iOS opens the link in Safari instead of a standalone window. ────────── -->
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="WealthLens"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#F2F3F5; }
  #splash {
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#F2F3F5; transition:opacity .35s ease;
  }
  #splash img { width:84px; height:84px; border-radius:20px; margin-bottom:16px; }
  #splash .name {
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:20px; font-weight:800; letter-spacing:-.5px;
    background:linear-gradient(90deg,#7c3aed,#0284c7);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  #splash .sub { margin-top:6px; font-size:12px; color:#9c8ec0; letter-spacing:.5px; }
  #splash.hide { opacity:0; pointer-events:none; }

  #appFrame { position:fixed; inset:0; width:100%; height:100%; border:none; background:#F2F3F5; }

  /* Fallback for browsers/webviews that block third-party cookies inside
     an iframe (rare, but happens on some locked-down Android WebViews) */
  #openDirect {
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    z-index:11; display:none; padding:10px 18px; border-radius:100px;
    background:#7c3aed; color:#fff; font-family:sans-serif; font-size:13px;
    font-weight:700; text-decoration:none; box-shadow:0 4px 16px rgba(124,58,237,.35);
  }
</style>
</head>
<body>

<div id="splash">
  <img src="icons/icon-192.png" alt="WealthLens"/>
  <div class="name">WealthLens</div>
  <div class="sub">1 Cr Club · Trading Intelligence</div>
</div>

<iframe id="appFrame"
        src="https://wealthlensos.streamlit.app/?embed=true&embed_options=disable_scrolling"
        allow="clipboard-read; clipboard-write"
        title="WealthLens"></iframe>

<a id="openDirect" href="https://wealthlensos.streamlit.app/" target="_blank" rel="noopener">
  Open in browser instead →
</a>

<script>
  // Hide splash once the iframe reports it has loaded.
  var frame = document.getElementById('appFrame');
  var splash = document.getElementById('splash');
  frame.addEventListener('load', function () {
    setTimeout(function () { splash.classList.add('hide'); }, 200);
  });

  // If nothing has loaded after 6s, something's blocking the iframe —
  // surface a direct link instead of leaving the user on a dead splash.
  setTimeout(function () {
    if (!splash.classList.contains('hide')) {
      document.getElementById('openDirect').style.display = 'block';
    }
  }, 6000);

  // Register the service worker (required for Android install eligibility).
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('service-worker.js').catch(function () {});
    });
  }
</script>

</body>
</html>
